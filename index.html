<div id="pad"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="a">⚔</button><button data-k="j">⤒</button></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),H=540,VH=360,K=2;let W=780;
function fit(){const a=innerWidth/Math.max(1,innerHeight);W=Math.round(VH*Math.max(1.4,Math.min(2.4,a)));cv.width=W*K;cv.height=VH*K}
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
const keys={},touch={};
addEventListener('keydown',e=>{keys[e.code]=1;if(/Space|Arrow/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();touch[k]=1},off=e=>{e.preventDefault();touch[k]=0};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));b.addEventListener('contextmenu',e=>e.preventDefault())});

let LW=4400;const GY=460;
let plats=[[-900,GY,2400,80],[1640,GY,960,80],[2780,GY,1120,80],[4040,GY,1200,80],
 [300,370,140,16],[540,300,140,16],[1330,370,120,16],[1520,380,100,16],[2000,370,120,16],[2180,300,200,16],[2420,370,110,16],[2640,390,100,16],[3100,370,140,16],[3330,300,160,16],[3560,370,120,16],
 [1150,GY-60,50,60,'s'],[3250,GY-60,60,60,'s'],[-80,60,80,400,'w'],[4400,60,80,400,'w']]
 .map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],k:a[4]}));
let camps=[{x:90,y:GY},{x:1780,y:GY},{x:4140,y:GY}];       // табори відродження гравця
let ecamps=[ // табори ворогів
 {x:700,y:GY,type:'slime',r:100},{x:1000,y:GY,type:'goblin',r:130},{x:1300,y:GY,type:'slime',r:60},
 {x:2280,y:300,type:'goblin',r:60},{x:2100,y:GY,type:'slime',r:100},{x:2960,y:GY,type:'goblin',r:100},{x:3450,y:GY,type:'slime',r:110},{x:3700,y:GY,type:'goblin',r:130}
].map(c=>({...c,e:null,t:0}));
const RESP=8;
const p={x:120,y:GY-40,w:22,h:40,vx:0,vy:0,face:1,hp:100,max:100,xp:0,lvl:1,atk:0,hit:true,inv:0,ground:false,coy:0,dead:false,deadT:0,anim:0};
let act=0,cam=-270,camY=180,t=0,jHeld=false,enemies=[],parts=[],texts=[],won=false,msgT=0;

function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function move(o,dt){o.x+=o.vx*dt;o.wall=false;
 for(const q of plats)if(ov(o,q)){o.x=o.vx>0?q.x-o.w:q.x+q.w;o.vx=0;o.wall=true}
 o.y+=o.vy*dt;o.ground=false;
 for(const q of plats)if(ov(o,q)){if(o.vy>0){o.y=q.y-o.h;o.ground=true}else o.y=q.y+q.h;o.vy=0}}
function burst(x,y,c,n,s){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*s;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-s*.3,l:.5+Math.random()*.5,c})}}
function txt(x,y,s,c){texts.push({x,y,s,c,l:1})}
function spawn(c){if(c.type=='bat'||c.type=='boss'){spawnFly(c);return}const big=c.type=='goblin';c.e={x:c.x-12,y:c.y-(big?34:22),w:big?24:26,h:big?34:22,vx:0,vy:0,hp:big?50:30,max:big?50:30,type:c.type,camp:c,dir:1,hurt:0,ph:Math.random()*6,ground:false};
 enemies.push(c.e);burst(c.x,c.y-14,'#c33',16,140)}
ecamps.forEach(spawn);

function die(){if(p.dead)return;if(run)run.deaths++;p.dead=true;p.deadT=2.4;p.vx=0;burst(p.x+11,p.y+20,'#e44',30,220)}
function respawn(){const c=camps[act]||{x:80,y:GY};p.x=c.x+30;p.y=c.y-p.h;p.vx=p.vy=0;p.hp=lvl=='cave'?Math.ceil(p.max*.5):p.max;p.inv=2;p.dead=false;burst(c.x+30,c.y-20,'#7fd',30,200);txt(c.x+30,c.y-70,'Відродження!','#7fd')}
function gain(n){p.xp+=n;txt(p.x,p.y-20,'+'+n+' XP','#fc4');
 while(p.xp>=p.lvl*50){p.xp-=p.lvl*50;p.lvl++;p.max+=15;p.hp=p.max;txt(p.x,p.y-44,'РІВЕНЬ '+p.lvl+'!','#ff6');burst(p.x+11,p.y+20,'#ff6',24,200)}}
function dmgOf(){return Math.round((12+p.lvl*4+(equip.w?ITEMS[equip.w].dmg:0))*(setN()>=2?1.15:1))}

function update(dt){if(uiOpen)return;
 t+=dt;
 const L=keys.KeyA||keys.ArrowLeft||touch.l,R=keys.KeyD||keys.ArrowRight||touch.r,J=keys.KeyW||keys.ArrowUp||keys.Space||touch.j,A=keys.KeyJ||keys.KeyK||keys.KeyX||touch.a;
 if(p.dead){p.deadT-=dt;if(p.deadT<=0)respawn()}
 else{
  const ax=(R?1:0)-(L?1:0);
  p.vx+=(ax*(300+spdOf())-p.vx)*Math.min(1,(p.ground?14:7)*dt);
  if(ax)p.face=ax;p.anim+=Math.abs(p.vx)*dt/260;
  p.coy=p.ground?.1:p.coy-dt;
  if(p.ground)p.dj=0;if(J&&!jHeld)p.buf=.12;p.buf=(p.buf||0)-dt;if(p.buf>0&&p.coy>0){p.vy=-760;p.coy=0;p.buf=0;burst(p.x+11,p.y+40,'#ccc',6,60)}else if(p.buf>0&&!p.ground&&!p.dj&&hasPerk('wing')){p.vy=-720;p.dj=1;p.buf=0;burst(p.x+11,p.y+40,'#b6f',10,100)}
  jHeld=!!J;
  if(A&&p.atk<=0){p.atk=.32;p.hit=false}
  if(p.atk>0){p.atk-=dt;if(!p.hit&&p.atk<.22){p.hit=true;
   const hb={x:p.face>0?p.x+p.w:p.x-56,y:p.y-6,w:56,h:p.h+12};hitConts(hb);
   for(const e of enemies)if(e.hp>0&&ov(hb,e)){const d=dmgOf();e.hp-=d;lifesteal(d);if(run)run.dmgDealt+=d;e.hurt=.3;e.vx=p.face*260;e.vy=-220;burst(e.x+e.w/2,e.y+e.h/2,'#fff',8,150);txt(e.x,e.y-8,'-'+d,'#fff');
    if(e.hp<=0)kill(e)}
   enemies=enemies.filter(e=>e.hp>0)}}
  p.inv=Math.max(0,p.inv-dt);
  p.vy=Math.min(p.vy+1900*dt,900);move(p,dt);
  p.x=Math.max(0,Math.min(LW-p.w,p.x));
  if(p.y>H+100)die();
  // табори гравця: чекпоінт + лікування
  camps.forEach((c,i)=>{if(Math.abs(p.x+11-c.x)<60&&Math.abs(p.y+40-c.y)<60){if(act!=i){act=i;txt(c.x,c.y-90,'Табір активовано','#fa5')}p.hp=Math.min(p.max,p.hp+20*dt)}});
  if(p.x>4300&&!won){won=true;msgT=6;msgS='Кінець тестового рівня — далі буде…'}
 }
 for(const c of ecamps)if(!c.e&&c.t>0){c.t-=dt;if(c.t<=0)spawn(c)}
 for(const e of enemies){
  e.ph+=dt;e.sq=(e.sq||0)+((e.stun>0?1:0)-(e.sq||0))*Math.min(1,10*dt);if(e.type=='bat'||e.type=='boss'){flyAI(e,dt);continue}const c=e.camp,d=p.x-e.x;let tg;
  if(e.type=='goblin'&&!p.dead&&Math.abs(d)<240&&Math.abs(p.y-e.y)<110&&Math.abs(e.x-c.x)<c.r+40){tg=Math.sign(d)*120;e.dir=Math.sign(d)||e.dir}
  else{if(e.x>c.x+c.r)e.dir=-1;if(e.x<c.x-c.r)e.dir=1;tg=e.dir*(e.type=='slime'?45:60)}
  if(e.stun>0)e.stun-=dt;if(e.hurt>0)e.hurt-=dt;else if(e.stun>0)e.vx*=.8;else e.vx+=(tg-e.vx)*Math.min(1,8*dt);
  e.vy=Math.min(e.vy+1900*dt,900);move(e,dt);if(e.wall)e.dir*=-1;
  if(e.type=='slime'&&e.ground&&e.hurt<=0&&!(e.stun>0)&&Math.random()<dt*.9)e.vy=-380;
  contact(e);
 }
 updLoot(dt);for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 for(const q of texts){q.y-=30*dt;q.l-=dt}texts=texts.filter(q=>q.l>0);
 if(msgT>0)msgT-=dt;
 const tx=p.x+11-W/2+p.face*50,ty=Math.max(0,Math.min(H-VH,p.y+p.h/2-VH*.58));cam+=(tx-cam)*Math.min(1,6*dt);camY+=(ty-camY)*Math.min(1,6*dt);
}

// ---------- малювання ----------
function ridge(par,base,amp,fr,col,sd){g.fillStyle=col;g.beginPath();g.moveTo(0,H);
 for(let x=0;x<=W+20;x+=20){const wx=x+cam*par;g.lineTo(x,base-amp*(Math.sin(wx*fr+sd)+.5*Math.sin(wx*fr*2.3+sd*2)))}
 g.lineTo(W,H);g.fill()}
function bg(){if(lvl=='cave'){caveBG();return}
 let s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#1b1f4b');s.addColorStop(.6,'#a9486a');s.addColorStop(1,'#f0956a');g.fillStyle=s;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<50;i++){const x=(i*173.3+7)%W,y=(i*91.7)%220;g.fillRect(x,y,1.5,1.5)}
 let r=g.createRadialGradient(W*.72,300,10,W*.72,300,170);r.addColorStop(0,'#fff4c0');r.addColorStop(.25,'#ffd27a');r.addColorStop(1,'rgba(255,150,90,0)');g.fillStyle=r;g.fillRect(W*.72-200,100,400,400);
 g.fillStyle='rgba(255,230,230,.25)';for(let i=0;i<5;i++){const x=((i*260+t*8-cam*.1)%1200+1200)%1200-120,y=70+i*38%120;g.beginPath();g.ellipse(x,y,70,16,0,0,6.3);g.ellipse(x+40,y-8,40,14,0,0,6.3);g.fill()}
 ridge(.12,380,70,.004,'#5a3560',1);ridge(.25,420,50,.006,'#42284f',3);
 g.fillStyle='#2a1a3a';for(let i=Math.floor(cam*.5/70)-1;i<Math.floor((cam*.5+W)/70)+2;i++){const x=i*70-cam*.5,h=60+Math.abs(Math.sin(i*7.3))*50;
  g.fillRect(x-3,GY-20-12,6,14);g.beginPath();g.moveTo(x-22,GY-30);g.lineTo(x,GY-30-h);g.lineTo(x+22,GY-30);g.fill()}
 ridge(.6,GY+10,16,.012,'#1f3a35',5);
}
function drawPlats(){if(lvl=='cave')caveFx();for(const q of plats){if(q.k){drawStone(q);continue}if(lvl=='cave'){drawCavePlat(q);continue}g.fillStyle='#4a3426';g.fillRect(q.x,q.y,q.w,q.h);
 g.fillStyle='#3a291d';for(let x=q.x+10;x<q.x+q.w-6;x+=34)g.fillRect(x,q.y+14+((x*7)%24),12,6);
 g.fillStyle='#4f9d4a';g.fillRect(q.x,q.y,q.w,8);g.fillStyle='#6cc060';g.fillRect(q.x,q.y,q.w,3);
 g.fillStyle='#4f9d4a';for(let x=q.x;x<q.x+q.w;x+=9){g.fillRect(x,q.y+8,4,3+(x*3)%4)}}}
function drawStone(q){const w=q.k=='w',R=q.x>0;
 if(w){const bx=R?q.x+170:q.x-250;g.fillStyle='#34243f';g.fillRect(bx,GY-240,70,240);g.fillRect(bx+110,GY-160,60,160);for(let i=0;i<4;i++)g.fillRect(bx+i*20,GY-254,12,14);g.fillStyle='#ffd27a';g.fillRect(bx+28,GY-190,12,18);g.fillRect(bx+130,GY-110,10,14)}
 const cvm=lvl=='cave';g.fillStyle=cvm?'#2d2540':'#5b5f6e';g.fillRect(q.x,q.y,q.w,q.h);g.strokeStyle=cvm?'#1d1730':'#3d4150';g.lineWidth=2;
 for(let y=q.y+18,r=0;y<q.y+q.h;y+=18,r++){g.beginPath();g.moveTo(q.x,y);g.lineTo(q.x+q.w,y);g.stroke();for(let x=q.x+(r%2?10:24);x<q.x+q.w;x+=28){g.beginPath();g.moveTo(x,y-18);g.lineTo(x,y);g.stroke()}}
 g.fillStyle=cvm?'#4d4068':'#7a7f91';g.fillRect(q.x,q.y,q.w,5);
 if(w){for(let x=q.x;x<q.x+q.w;x+=20)g.fillRect(x,q.y-10,12,10);
  const cx=q.x+q.w/2;g.fillStyle='#2e2016';g.fillRect(q.x+14,q.y+q.h-84,q.w-28,84);g.beginPath();g.arc(cx,q.y+q.h-84,(q.w-28)/2,Math.PI,0);g.fill();g.fillStyle='#6b4a2a';g.fillRect(cx-1,q.y+q.h-84,2,84);
  for(const ty of [q.y+90,q.y+190]){g.fillStyle='#6b4a2a';g.fillRect(cx-2,ty,4,20);const f=Math.sin(t*14+ty)*2;g.fillStyle='#e8541c';g.beginPath();g.ellipse(cx,ty-6,6,10+f,0,0,6.3);g.fill();g.fillStyle='#ffc24a';g.beginPath();g.ellipse(cx,ty-4,3,6+f/2,0,0,6.3);g.fill()}
  g.save();g.translate(cx+4,q.y+300);g.rotate(-Math.PI/2);g.fillStyle='#e8e2d0';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(R?'ДАЛІ — НОВІ ЗЕМЛІ':'ПОЧАТОК',0,0);g.restore()}}
function fire(x,y,big){const f=Math.sin(t*14+x)*2;
 g.fillStyle='#4a2d18';g.fillRect(x-14,y-5,28,5);
 const n=big?1.4:.8;g.fillStyle='#e8541c';g.beginPath();g.moveTo(x-10*n,y-5);g.quadraticCurveTo(x+f,y-40*n,x+10*n,y-5);g.fill();
 g.fillStyle='#ffc24a';g.beginPath();g.moveTo(x-5*n,y-5);g.quadraticCurveTo(x-f,y-24*n,x+5*n,y-5);g.fill()}
function drawCamps(){
 camps.forEach((c,i)=>{const on=i==act;
  if(on){const r=g.createRadialGradient(c.x,c.y-20,5,c.x,c.y-20,130);r.addColorStop(0,'rgba(255,170,70,.4)');r.addColorStop(1,'rgba(255,170,70,0)');g.fillStyle=r;g.fillRect(c.x-130,c.y-150,260,260)}
  g.fillStyle='#2f5aa8';g.beginPath();g.moveTo(c.x-70,c.y);g.lineTo(c.x-38,c.y-62);g.lineTo(c.x-6,c.y);g.fill();
  g.fillStyle='#1c3a74';g.beginPath();g.moveTo(c.x-44,c.y);g.lineTo(c.x-38,c.y-62);g.lineTo(c.x-32,c.y);g.fill();
  g.fillStyle='#6b4a2a';g.fillRect(c.x+34,c.y-60,4,60);g.fillStyle=on?'#ffb347':'#888';g.beginPath();g.moveTo(c.x+38,c.y-60);g.lineTo(c.x+62,c.y-52);g.lineTo(c.x+38,c.y-44);g.fill();
  fire(c.x+8,c.y,on);

 const best=runs.reduce((m,r)=>Math.max(m,r.score),0);run.record=run.score>best;runs.unshift(run);runs=runs.slice(0,20);
 try{localStorage.setItem('rpgRuns',JSON.stringify(runs))}catch(e){}

 if(r.record)pb.append(el('p','rec','Новий рекорд!'));pb.append(table(runRows(r)));

function statsView(c){if(!runs.length){c.append(el('p','empty','Ще немає проходжень підземелля'));return}
 const best=runs.reduce((a,b)=>b.score>a.score?b:a);c.append(el('h4',0,'Найкращий результат'));c.append(table(runRows(best)));c.append(el('h4',0,'Останні проходження'));
 runs.slice(0,8).forEach(r=>c.append(el('div','row empty',(r.completed?'✔ ':'✖ ')+r.score+' очок · '+fmt(r.time)+' · вбито '+r.kills+' · смертей '+r.deaths)))}
const CD={barrel:{w:34,h:42,hp:2},crate:{w:36,h:34,hp:2},urn:{w:26,h:38,hp:1},chest:{w:48,h:34,hp:1}};
function mkConts(){return [['barrel',330,GY],['crate',360,380],['urn',600,GY],['urn',560,320],['barrel',900,GY],['chest',1090,360],['crate',1290,300],['urn',1370,400],['barrel',1500,GY],['crate',1620,GY],['barrel',1830,GY],['urn',2050,GY],['chest',2330,GY],['urn',2560,360],['chest',2820,300],['barrel',3050,360],['urn',3300,320]].map(a=>({k:a[0],x:a[1],y:a[2],hp:CD[a[0]].hp,shake:0,open:false}))}
function contLoot(k,x,y){const r=Math.random,gl=(a,b)=>lp(x,y,'gold',a+(r()*(b-a+1)|0));
 if(k=='urn'){gl(3,12);if(r()<.15)lp(x,y,'hp1');if(r()<.06)lp(x,y,'shard')}
 else if(k=='barrel'){gl(2,8);if(r()<.35)lp(x,y,'gel');if(r()<.2)lp(x,y,'fang');if(r()<.1)lp(x,y,'hp1')}
 else if(k=='crate'){gl(4,10);if(r()<.25)lp(x,y,'hp1');if(r()<.3)lp(x,y,'wing');if(r()<.05)lp(x,y,'shard')}
 else{gl(25,60);lp(x,y,'hp1');if(r()<.5)lp(x,y,'hp2');if(r()<.5)lp(x,y,'shard');if(r()<.35)lp(x,y,'wing');if(r()<.25)lp(x,y,['h1','b1','f1','w1','h2','b2','f2'][r()*7|0]);if(r()<.03)lp(x,y,'w3')}}
function hitConts(hb){for(const c of conts.slice()){if(c.k=='chest')continue;const d=CD[c.k];if(ov(hb,{x:c.x-d.w/2,y:c.y-d.h,w:d.w,h:d.h})){c.hp--;c.shake=.2;burst(c.x,c.y-d.h/2,'#a87',4,80);if(c.hp<=0)breakCont(c)}}}
function breakCont(c){const d=CD[c.k];conts=conts.filter(z=>z!==c);burst(c.x,c.y-d.h/2,c.k=='urn'?'#c98':c.k=='crate'?'#8a6a3a':'#7a4e28',16,180);contLoot(c.k,c.x,c.y-d.h/2);if(run)run.containers++}
function openChest(){const c=conts.find(c=>c.k=='chest'&&!c.open&&Math.abs(p.x+11-c.x)<50&&Math.abs(p.y+40-c.y)<50);if(!c)return;c.open=true;burst(c.x,c.y-20,'#ffd86b',20,200);contLoot('chest',c.x,c.y-24);if(run)run.containers++}
function drawConts(){for(const c of conts){const ox=c.shake>0?Math.sin(c.shake*70)*2:0;g.save();g.translate(c.x+ox,c.y);
 if(c.k=='barrel'){g.fillStyle='#7a4e28';g.beginPath();g.moveTo(-14,0);g.quadraticCurveTo(-20,-21,-14,-42);g.lineTo(14,-42);g.quadraticCurveTo(20,-21,14,0);g.fill();g.fillStyle='#3a3a44';g.fillRect(-17,-12,34,4);g.fillRect(-17,-32,34,4);g.fillStyle='#9a6a3a';g.beginPath();g.ellipse(0,-42,14,4,0,0,6.3);g.fill()}
 else if(c.k=='crate'){g.fillStyle='#8a6a3a';g.fillRect(-18,-34,36,34);g.strokeStyle='#5a4020';g.lineWidth=3;g.strokeRect(-17,-33,34,32);g.beginPath();g.moveTo(-17,-33);g.lineTo(17,-1);g.moveTo(17,-33);g.lineTo(-17,-1);g.stroke()}
 else if(c.k=='urn'){g.fillStyle='#a8683a';g.beginPath();g.ellipse(0,-17,13,17,0,0,6.3);g.fill();g.fillRect(-6,-38,12,8);g.fillStyle='#7a4a24';g.fillRect(-9,-40,18,4);g.fillStyle='#e0aa70';g.fillRect(-12,-20,24,4);g.fillStyle='#7a4a24';for(let i=-9;i<=6;i+=5)g.fillRect(i,-14,3,3)}
 else{const o=c.open;g.fillStyle='#6b4a2a';g.fillRect(-24,-20,48,20);g.fillStyle='#c9b25a';g.fillRect(-24,-12,48,3);g.fillRect(-4,-14,8,8);
  g.save();g.translate(-24,-20);g.rotate(o?-1.9:0);g.fillStyle='#8a5a2b';g.beginPath();g.moveTo(0,0);g.lineTo(48,0);g.quadraticCurveTo(48,-16,24,-16);g.quadraticCurveTo(0,-16,0,0);g.fill();g.fillStyle='#c9b25a';g.fillRect(0,-4,48,3);g.restore();
  if(o){g.fillStyle='rgba(255,220,120,.35)';g.fillRect(-20,-24,40,6)}else{g.fillStyle='rgba(255,220,120,'+(.08+.05*Math.sin(t*4))+')';g.beginPath();g.arc(0,-12,34,0,6.3);g.fill()}
  if(!o&&near=='chest'&&Math.abs(p.x+11-c.x)<50){g.fillStyle='#ffd86b';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('Відкрити (E)',0,-48)}}
 g.restore()}}
function drawPortal(){if(!portal)return;const x=portal.x,y=GY-52,a=Math.min(1,portal.t);g.save();g.translate(x,y);g.globalAlpha=a;
 for(let i=0;i<4;i++){g.strokeStyle=['#c35bff','#7a6cff','#e0b0ff','#55aadd'][i];g.lineWidth=4;const s=t*(2+i)*(i%2?-1:1);g.beginPath();g.ellipse(0,0,26+i*4*Math.sin(t*2+i),48-i*5,0,s,s+4.2);g.stroke()}
 g.fillStyle='rgba(180,120,255,.25)';g.beginPath();g.ellipse(0,0,24,46,0,0,6.3);g.fill();
 g.fillStyle='#e8c8ff';for(let i=0;i<8;i++){const q=t*2+i;g.fillRect(Math.cos(q+i)*30,Math.sin(q*1.3)*50,3,3)}
 g.globalAlpha=1;g.fillStyle='#fff';g.font='bold 11px system-ui';g.textAlign='center';g.fillText('ПОРТАЛ',0,-62);
 if(near=='portal'){g.fillStyle='#ffd86b';g.font='bold 13px system-ui';g.fillText('Увійти (E)',0,-76+Math.sin(t*5)*2)}g.restore()}
const fs=document.getElementById('fs');
if(document.fullscreenEnabled){fs.style.display='block';fs.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen();try{await screen.orientation.lock('landscape')}catch(e){}}}catch(e){}}}
function loop(n){const port=innerHeight>innerWidth;acc+=Math.min(.1,(n-last)/1000);last=n;if(port||uiOpen)acc=0;while(acc>=1/60){update(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
